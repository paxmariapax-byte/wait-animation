<!DOCTYPE html>
<html>
<meta charset='UTF-8' />
<meta content='width=device-width, initial-scale=1, user-scalable=1, minimum-scale=1, maximum-scale=5' name='viewport' />
<meta content='IE=edge' http-equiv='X-UA-Compatible' />
<script src="https://unpkg.com/typeit@8.7.0/dist/index.umd.js"></script> 
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<head>
  <title>feliz dia de las madres jijijiji</title>
</head>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;700&display=swap');
  @import url('https://fonts.googleapis.com/css2?family=Itim&display=swap');
  @import url('https://fonts.googleapis.com/css2?family=Shippori+Antique:wght@400;700&display=swap');

  :root {
    --tombol-bg: rgba(0, 0, 0, .3);
    --tombol-teks: #fff;
    --gaya-font: 'Shippori Antique', sans-serif;
    --gaya-font2: 'Itim', cursive;
  }

  body {
    background-color: #000;
    font-family: var(--gaya-font);
    padding: 20px 25px;
    -webkit-user-select: none;
    user-select: none;
    overflow: hidden;
  }

  #bodyblur {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0, 0, 0, .5);
    transition: all 1s ease;
  }

  #wallpaper {
    width: 100%; height: 100%;
    object-fit: cover;
    filter: brightness(0.6);
  }

  blockquote {
    position: absolute;
    opacity: 0;
    visibility: hidden;
    background: var(--tombol-bg);
    box-shadow: rgba(255, 255, 255, 0.3) 0px 7px 29px 0px;
    transform: scale(.1);
    transition: all 1s ease;
    margin: 120px 20px;
    color: var(--tombol-teks);
    text-shadow: 0px 2px 2px rgba(0, 0, 0, .8);
    width: 85%; max-width: 400px;
    text-align: center;
    padding: 20px;
    border: 1px solid #fff;
    border-radius: 12px;
    z-index: 99;
  }

  blockquote p { font-size: 16px; font-weight: 700; }
  
  #Content {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    z-index: 10;
  }

  .kumpulanstiker img {
    display: none;
    background: rgba(255, 255, 255, 0.2);
    border: 1px solid rgba(255, 255, 255, 0.3);
    border-radius: 50%;
    padding: 10px;
    width: 100px; height: 100px;
    margin: 20px 0;
  }

  #loveIn { cursor: pointer; background: #fff; border-radius: 50%; width: 60px; height: 60px; display: flex; align-items: center; justify-content: center; font-size: 30px; transition: 0.3s; }
  
  #opsL { font-size: 11px; opacity: 0; margin-top: 20px; cursor: pointer; }

  .heart-icon { position: fixed; top: -10vh; z-index: 100; width: 20px; height: 20px; fill: pink; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(360deg); } }
</style>

<body>
  <div id="bodyblur">
    <img src="https://images.unsplash.com/photo-1526047932273-341f2a7631f9?q=80&w=1000" id="wallpaper" />
  </div>

  <div id='Content'>
    <div id="loveIn">❤️</div>
    <p id="ket" style="color: white; margin-top: 15px;">¡Toca el corazón, mami!</p>

    <div class="kumpulanstiker">
      <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHJueXF6eXJueXF6eXJueXF6eXJueXF6eXJueXF6eXJueXF6JmVwPXYxX2ludGVybmFsX2dpZl9ieV9iZWFycyZjdD1n/vSkCKRGLuO0Y8/giphy.gif" id="fotostiker" />
    </div>

    <h2 id="halo" style="color: white; text-shadow: 2px 2px 4px #000;"></h2>

    <blockquote id='bq'>
      <p id="kalimat"></p>
      <p id="pesan1" style="display:none">¡Mira mamá, un regalo! 🎁🐱</p>
      <p id="pesan2" style="display:none">Espera unos segundos... ⏳</p>
      <p id="pesan4" style="display:none">En 3 segundos... ¡Feliz día de las madres! ❤️ Eres la mejor.</p>
      <p id="opsL">✨ haz click para continuar ✨</p>
    </blockquote>
  </div>

  <script>
    const bq = document.getElementById('bq');
    const loveIn = document.getElementById('loveIn');
    const fotostiker = document.getElementById('fotostiker');
    const halo = document.getElementById('halo');
    const kalimat = document.getElementById('kalimat');
    const opsL = document.getElementById('opsL');

    loveIn.onclick = function() {
      loveIn.style.display = "none";
      document.getElementById('ket').style.display = "none";
      startAnimation();
    }

    function startAnimation() {
      new TypeIt("#halo", {
        strings: ["¡Hola Mami! ✨"],
        startDelay: 50,
        speed: 50,
        afterComplete: function() {
          showQuote();
        }
      }).go();
    }

    function showQuote() {
      fotostiker.style.display = "inline-flex";
      bq.style.opacity = "1";
      bq.style.visibility = "visible";
      bq.style.transform = "scale(1)";
      
      new TypeIt("#kalimat", {
        strings: ["Espera unos segundos jijiji 🐱", "Tengo algo para ti..."],
        speed: 40,
        waitUntilVisible: true,
        afterComplete: function() {
          opsL.style.opacity = "1";
        }
      }).go();
    }

    let step = 0;
    bq.onclick = function() {
      step++;
      if(step == 1) {
        kalimat.innerHTML = "Recupérate pronto de tu pierna... ❤️";
      } else if(step == 2) {
        kalimat.innerHTML = "¡Disfruta tu día! 🎉 Eres una genia de las genias.";
        setInterval(createHeart, 300);
      } else if(step >= 3) {
        finalSurprise();
      }
    }

    function createHeart() {
      const heart = document.createElement("div");
      heart.innerHTML = "❤️";
      heart.className = "heart-icon";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.animationDuration = Math.random() * 3 + 2 + "s";
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 5000);
    }

    async function finalSurprise() {
      const { isConfirmed } = await Swal.fire({
        title: '¿Te gustó la sorpresa?',
        text: 'Responde con sinceridad 😆',
        icon: 'question',
        showCancelButton: true,
        confirmButtonText: '¡SIII, me encantó!',
        cancelButtonText: 'No, eres mala jaja'
      });

      if (isConfirmed) {
        Swal.fire('¡Sabía que te gustaría! 😍', '¡Te quiero mucho mami!', 'success');
      }
    }
  </script>
</body>
</html>
